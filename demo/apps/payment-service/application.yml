spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app:
  kafka:
    consumer:
      group-id-base: payment-service
    topics:
      payment-requested: payments.payment.requested
      payment-captured: payments.payment.captured
      payment-failed: payments.payment.failed
---
spring:
  config:
    activate:
      on-profile: [prod]
  kafka:
    consumer:
      group-id: "${app.kafka.consumer.group-id-base}-cg"
app:
  kafka:
    topics:
      payment-requested: ${PAYMENT_REQUESTED_TOPIC:payments.payment.requested}
      payment-captured: ${PAYMENT_CAPTURED_TOPIC:payments.payment.captured}
      payment-failed: ${PAYMENT_FAILED_TOPIC:payments.payment.failed}
