spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
server:
  port: 8080
app:
  kafka:
    topics:
      order-created: orders.order.created
      order-updated: orders.order.updated
      order-cancelled: orders.order.cancelled
